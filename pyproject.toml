[tool.poetry]
name = "starixnet"
version = "0.1.0"
description = "Deep learning model for multivariate and multi-attribute time-series forecasting"
authors = ["Ahmed Abdulaal <ahmed.abdulaal@walmart.com>"]
readme = "README.md"
license = "Apache-2.0"
packages = [{include = "benchmark"}, {include = "starixnet"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
coverage = "^7.8.0"
joblib = "^1.4.2"
lightning = "^2.5.1.post0"
numpy = "^2.2.5"
pandas = "^2.2.3"
pytest = "^8.3.5"
pytest-cov = "^6.1.1"
pytorch-forecasting = "^1.3.0"
scipy = "^1.15.2"
statsmodels = "^0.14.4"
torch = "^2.6.0"
tqdm = "^4.67.1"

[tool.poetry.group.dev.dependencies]
setuptools = "^79.0.0"
coverage = "^7.8.0"
flake8 = "^7.2.0"
pytest = "^8.3.5"
pytest-cov = "^6.1.1"

[tool.flake8]
max-line-length = 120
extend-ignore = "E203"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.distutils.bdist_wheel]
universal = true
