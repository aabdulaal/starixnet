[project]
name = "starixnet"
version = "0.1.0"
description = "Deep learning model for multivariate and multi-attribute time-series forecasting."
authors = [{ name = "Ahmed Abdulaal", email = "ahmed.abdulaal@walmart.com" }]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "joblib>=1.4.2",
    "lightning>=2.5.1.post0",
    "numpy>=2.2.5",
    "pandas>=2.2.3",
    "scipy>=1.15.2",
    "statsmodels>=0.14.4",
    "torch>=2.6.0",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
dev = [
    "coverage>=7.8.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "ruff>=0.7.0",
    "setuptools>=79.0.0",
]
notebook = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["starixnet", "benchmark"]

[tool.uv]
package = true

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E203",   # whitespace before ':' (conflicts with formatter)
    "B008",   # function call in default argument (common nn.Module pattern)
    "B023",   # function definition does not bind loop variable (Python idiom)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]  # allow `assert False`

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
log_cli = true
log_level = "info"
log_cli_level = "info"
addopts = [
    "-s",
    "--cov-fail-under=80",
    "--cov-report=term",
    "--cov-report=xml:./coverage.xml",
    "--junitxml=./results.xml",
    "--ignore=tests/integration",
]
